name: Liver Cancer Digest

on:
  schedule:
    # GitHub Actions uses UTC. 00:00 UTC is 08:00 in Asia/Shanghai.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_send:
        description: "Send even when no new PMID is found"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: liver-cancer-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TIMEOUT: "300"
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
          LOOKBACK_HOURS: "24"
          PUBMED_RETMAX: "100"
          STATE_FILE: ${{ github.workspace }}/state.json
          LOG_FILE: ${{ github.workspace }}/digest.log
        run: |
          if [[ "${{ inputs.force_send }}" == "true" ]]; then
            python liver_cancer_digest.py --all
          else
            python liver_cancer_digest.py
          fi

      - name: Persist state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [[ -e state.json ]] && git add state.json || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update liver cancer digest state"
            git push
          fi

      - name: Upload run log
        if: always() && hashFiles('digest.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: liver-cancer-digest-log-${{ github.run_id }}
          path: digest.log
          retention-days: 30
